[workspace]
members = ["crates/api", "crates/domain", "crates/application", "crates/persistence"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.82"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = { version = "1", features = ["serde"] }
